version: '3.9'

services:
  # Local PostgreSQL (alternative to Supabase for offline dev)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: drivesafe_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
